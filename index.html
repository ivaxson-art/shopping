<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Boutique</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d2a24;--ac:#1f7a5a;--card:#fff;--mut:#6b756f;--bd:#e3e0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--fg:#eef2ef;--ac:#4cc79b;--card:#1e2823;--mut:#9aa8a0;--bd:#2d3a34}}
:root[data-theme="dark"]{--bg:#141a17;--fg:#eef2ef;--ac:#4cc79b;--card:#1e2823;--mut:#9aa8a0;--bd:#2d3a34}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{padding:28px 18px 8px;text-align:center}
h1{margin:0;font-size:1.7rem}
header p{margin:4px 0 0;color:var(--mut)}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:center}
.pic{font-size:3rem}
.card h3{margin:6px 0 2px;font-size:1rem}
.price{color:var(--ac);font-weight:700}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:9px 16px;background:var(--ac);color:#fff}
.card button{margin-top:8px;width:100%}
section{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:18px}
h2{margin:0 0 10px;font-size:1.15rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.q button{padding:2px 10px}
input{width:100%;box-sizing:border-box;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);margin-top:8px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.wa{background:#25a244;text-align:center}
.note{color:var(--mut);font-size:.9rem}
</style>
</head>
<body>
<header>
<h1>Ma Boutique</h1>
<p>Choisissez vos articles, commandez sur WhatsApp</p>
</header>
<div class="wrap">
<div class="grid" id="grid"></div>

<section>
<h2>🛒 Mon panier</h2>
<div id="cart"><p class="note">Votre panier est vide.</p></div>
<div id="total" style="font-weight:700;margin-top:8px"></div>
<input id="nom" placeholder="Votre nom">
<input id="ville" placeholder="Ville / adresse de livraison">
<div class="btns">
<button class="wa" onclick="order(0)">Commander sur WhatsApp (656 89 96 33)</button>
<button class="wa" onclick="order(1)">Commander sur WhatsApp (650 48 47 77)</button>
</div>
<p class="note">Après l’envoi du message, nous confirmons la disponibilité et vous indiquons comment payer par MTN MoMo ou Orange Money. La commande est validée une fois le paiement reçu.</p>
</section>
</div>
<script>
var NUMS=["237656899633","237650484777"];
// Modifiez ici vos articles : nom, prix en FCFA, emoji
var P=[
{n:"Article exemple 1",p:5000,e:"👕"},
{n:"Article exemple 2",p:12000,e:"👟"},
{n:"Article exemple 3",p:7500,e:"🎧"},
{n:"Article exemple 4",p:3000,e:"🧢"}
];
var c={};
function f(x){return x.toLocaleString("fr-FR")+" FCFA"}
function draw(){
var g=document.getElementById("grid");
g.innerHTML=P.map(function(a,i){return '<div class="card"><div class="pic">'+a.e+'</div><h3>'+a.n+'</h3><div class="price">'+f(a.p)+'</div><button onclick="add('+i+',1)">Ajouter</button></div>'}).join("");
}
function add(i,d){c[i]=(c[i]||0)+d;if(c[i]<=0)delete c[i];cart()}
function cart(){
var k=Object.keys(c),t=0,h="";
k.forEach(function(i){t+=P[i].p*c[i];h+='<div class="row"><span>'+P[i].n+'<br><span class="note">'+f(P[i].p)+'</span></span><span class="q"><button onclick="add('+i+',-1)">−</button> '+c[i]+' <button onclick="add('+i+',1)">+</button></span></div>'});
document.getElementById("cart").innerHTML=h||'<p class="note">Votre panier est vide.</p>';
document.getElementById("total").textContent=k.length?"Total : "+f(t):"";
}
function order(w){
var k=Object.keys(c);
if(!k.length){alert("Ajoutez d’abord un article au panier.");return}
var t=0,m="Bonjour, je souhaite commander :\n";
k.forEach(function(i){t+=P[i].p*c[i];m+="- "+c[i]+" x "+P[i].n+" ("+f(P[i].p)+")\n"});
m+="Total : "+f(t)+"\n";
var n=document.getElementById("nom").value.trim(),v=document.getElementById("ville").value.trim();
if(n)m+="Nom : "+n+"\n";
if(v)m+="Livraison : "+v+"\n";
window.open("https://wa.me/"+NUMS[w]+"?text="+encodeURIComponent(m),"_blank");
}
draw();
</script>
</body>
</html>
